name: QA con Gemini
on:
  push:
    paths:
      - 'app/**'
      - 'contratos/**'
      - 'conocimiento/**'
      - 'specs/aplicacion.md'
      - 'agente/**'
      - 'flujo/**'
      - 'qa_core.py'
      - 'procesar.py'
      - 'scripts/**'
      - 'preparar-workshop.ps1'
      - 'taller.ps1'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/qa.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Motor de análisis
        type: choice
        options: [evidencia, gemini]
        default: evidencia
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Ejecutar agente QA y revisor
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GOOGLE_GENAI_USE_ENTERPRISE: 'FALSE'
          QA_MODE: ${{ inputs.mode || vars.QA_MODE || 'evidencia' }}
        run: python procesar.py --mode "$QA_MODE" --trigger github-actions --fail-on-defects
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-qa
          path: salida/
          if-no-files-found: warn
